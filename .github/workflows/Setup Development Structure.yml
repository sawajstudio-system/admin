              "Factory/Management/assets/fonts/PlayfairDisplay.ttf":"Assets/PlayfairDisplay.ttf",
              "Factory/Management/assets/fonts/YatraOne.ttf":"Assets/YatraOne.ttf",
              "Factory/Management/assets/fonts/Cinzel.ttf":"Assets/Cinzel.ttf",
              "Factory/Management/assets/fonts/Lora.ttf":"Assets/Lora.ttf",
              "Factory/Management/assets/fonts/Montserrat.ttf":"Assets/Montserrat.ttf",
              "Factory/Management/assets/fonts/ReemKufi.ttf":"Assets/ReemKufi.ttf",
              "Factory/Management/assets/fonts/RozhaOne.ttf":"Assets/RozhaOne.ttf",
              "Factory/Management/assets/fonts/Scheherazade.ttf":"Assets/Scheherazade.ttf",
              "Factory/Management/assets/fonts/Eczar.ttf":"Assets/Eczar.ttf",
              "Factory/Management/assets/logo.png":"Assets/sawaj_logo.png",
          }
          copied = 0
          for src, dst in COPY.items():
              sp, dp = ROOT/src, ROOT/dst
              if sp.exists():
                  dp.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(sp, dp)
                  copied += 1
          log(f"{copied} files copied from Factory", "📋")
          
