name: 🎬 Setup Development Structure

on:
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: 'Setup के बाद pipeline run करें? (Story generator बनने के बाद true करें)'
        required: false
        type: boolean
        default: false

concurrency:
  group: story-setup
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: 1. 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ═══════════════════════════════════════════════════════
      # 3. CREATE FULL STRUCTURE + ALL FILES
      # ═══════════════════════════════════════════════════════
      - name: 3. 🏗️ Build Full Structure & Files
        run: |
          python3 <<'PYEOF'
import os, re, json, shutil
from pathlib import Path

ROOT = Path.cwd()
def log(m, e="•"): print(f"{e} {m}")

# ═══════════════════════════════════════════════════════════
# A. FOLDERS
# ═══════════════════════════════════════════════════════════
FOLDERS = [
    "API/AI_Models","API/Video_Sources","API/Music_Sources",
    "API/Photo_Sources","API/Islamic_Content","API/Audio_Text",
    "URL/Media","URL/Islamic","URL/TTS_Translation","URL/Text_Content",
    "Assets",
    "Config/App_Configs","Config/Language_Settings",
    "Config/Style_Settings","Config/Template_Settings",
    "Uploader",
    "Story/Pipeline_Orchestration","Story/Content","Story/Audio",
    "Story/Video","Story/Subtitles_Text","Story/Thumbnails",
    "Story/Final_Render","Story/Upload","Story/Runtime_Logs",
]
for f in FOLDERS:
    (ROOT/f).mkdir(parents=True, exist_ok=True)
log(f"{len(FOLDERS)} folders created", "📁")

# ── __init__.py everywhere ──
PACKAGES = [f for f in FOLDERS if not f.endswith("Runtime_Logs")] + ["API","URL","Config","Story"]
for p in PACKAGES:
    init = ROOT/p/"__init__.py"
    if not init.exists(): init.write_text("")
log(f"{len(PACKAGES)} __init__.py created", "🐍")

# ═══════════════════════════════════════════════════════════
# B. COPY FILES FROM FACTORY (Factory safe)
# ═══════════════════════════════════════════════════════════
