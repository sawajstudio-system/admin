copied = 0
for src, dst in COPY.items():
    sp, dp = ROOT/src, ROOT/dst
    if sp.exists():
        dp.parent.mkdir(parents=True, exist_ok=True)
        shutil.copy2(sp, dp)
        copied += 1
log(f"{copied} files copied from Factory", "📋")

