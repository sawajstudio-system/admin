          PY_STUBS = {
              "API/AI_Models/magic.py": '"""STUB: MagicHour AI."""\nimport os\ndef generate(prompt, max_tokens=500):\n    if not os.getenv("MAGICHOUR_API_KEY"): return None\n    return None\n',
              "API/AI_Models/tanvo.py": '"""STUB: Tanvo AI."""\nimport os\ndef generate(prompt, max_tokens=500):\n    if not os.getenv("TANVO_API_KEY"): return None\n    return None\n',
              "API/Video_Sources/video_fallback.py": 'from pexels_video import fetch as pexels_video\nfrom pixabay_video import fetch as pixabay_video\nfrom coverr import fetch as coverr_video\nfrom gradient import fetch as gradient_video\n\ndef fetch(query="islamic mosque night", duration=20, output_path="temp/bg.mp4"):\n    for name, fn in [("Pexels", pexels_video), ("Pixabay", pixabay_video), ("Coverr", coverr_video), ("Gradient", gradient_video)]:\n        try:\n            if fn(query=query, duration=duration, output_path=output_path):\n                return output_path\n        except Exception: pass\n    return None\n',
              "API/Music_Sources/music_fallback.py": 'from freesound import fetch as freesound\nfrom pixabay_music import fetch as pixabay_music\n\ndef fetch(query="soft ambient", duration=60, output_path="temp/music.mp3"):\n    for name, fn in [("Freesound", freesound), ("Pixabay", pixabay_music)]:\n        try:\n            if fn(duration=duration, output_path=output_path):\n                return output_path\n        except Exception: pass\n    return None\n',
