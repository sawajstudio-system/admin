              "API/Audio_Text/voice_fallback.py": 'import sys, os\nfrom elevenlabs import generate as elevenlabs_tts\nsys.path.insert(0, os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(__file__))), "URL", "TTS_Translation"))\nfrom edge_tts import generate as edge_tts\n\ndef generate(text, output_path="temp/voice.mp3"):\n    try:\n        if elevenlabs_tts(text, output_path): return output_path\n    except Exception: pass\n    try:\n        if edge_tts(text, output_path): return output_path\n    except Exception: pass\n    return None\n',
              "API/Audio_Text/translate_fallback.py": 'import sys, os\nfrom ai_fallback import generate_text\nsys.path.insert(0, os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(__file__))), "URL", "TTS_Translation"))\nfrom mymemory import translate as mymemory\n\ndef translate(text, target_lang="hi"):\n    try:\n        result = generate_text(f"Translate to {target_lang}. Only output translation:\\n\\n{text}", 500)\n        if result: return result\n    except Exception: pass\n    return mymemory(text, target_lang)\n',
