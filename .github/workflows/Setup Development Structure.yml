      # ═══════════════════════════════════════════════════════
      # 4. VERIFY
      # ═══════════════════════════════════════════════════════
      - name: 4. 🔍 Verify Structure
        run: |
          echo "════════ ROOT ════════"
          ls -la | head -20
          echo ""
          echo "════════ API ════════"
          find API -type f | sort
          echo ""
          echo "════════ URL ════════"
          find URL -type f | sort
          echo ""
          echo "════════ Story ════════"
          find Story -type f | sort
          echo ""
          echo "════════ FILE COUNT ════════"
          find API URL Story Config Uploader Assets -type f | wc -l

      # ═══════════════════════════════════════════════════════
      # 5. COMMIT
      # ═══════════════════════════════════════════════════════
      - name: 5. 💾 Commit to Development Repo
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "✅ No changes"
            exit 0
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions Bot"
          git add -A
          git commit -m "🏗️ Full structure setup: API/URL/Story/Config/Assets/Uploader (+stubs, +configs, +placeholders)"
          git push
          echo "✅ Pushed to Development"

      # ═══════════════════════════════════════════════════════
      # 6. OPTIONAL: RUN PIPELINE
      # ═══════════════════════════════════════════════════════
      - name: 6. 📦 Install Requirements
        if: ${{ inputs.run_pipeline == true }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 7. 🎬 Run Story Pipeline
        if: ${{ inputs.run_pipeline == true }}
        working-directory: Story/Pipeline_Orchestration
        env:
          PYTHONPATH: >-
            ${{ github.workspace }}/Story/Pipeline_Orchestration:
            ${{ github.workspace }}/API/AI_Models:
            ${{ github.workspace }}/API/Video_Sources:
            ${{ github.workspace }}/API/Music_Sources:
            ${{ github.workspace }}/API/Islamic_Content:
            ${{ github.workspace }}/API/Audio_Text:
            ${{ github.workspace }}/URL/Islamic:
            ${{ github.workspace }}/URL/TTS_Translation:
            ${{ github.workspace }}/Uploader:
            ${{ github.workspace }}/Config/App_Configs
        run: python -u composer.py

      - name: 8. ✅ Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════"
          echo "✅ SETUP COMPLETE"
          echo "═══════════════════════════════════════════"
          echo ""
          echo "📌 Next steps:"
          echo "  1. Delete Factory/ manually from Development repo"
          echo "  2. Add real binary assets to Assets/"
          echo "  3. Build story generator modules (Story/*)"
          echo "  4. Then run workflow with run_pipeline=true"
          echo ""
