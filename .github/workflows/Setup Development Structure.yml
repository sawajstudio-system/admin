              "Factory/Management/5_Audio_Text/outro_AI.py":"API/Audio_Text/outro_AI.py",
              "Factory/Management/5_Audio_Text/elevenlabs.py":"API/Audio_Text/elevenlabs.py",
              "Factory/Management/5_Audio_Text/edge_tts.py":"URL/TTS_Translation/edge_tts.py",
              "Factory/Management/5_Audio_Text/mymemory.py":"URL/TTS_Translation/mymemory.py",
              "Factory/Management/Uploader/story_upload.py":"Uploader/story_upload.py",
              "Factory/branch/story/main.py":"Story/Pipeline_Orchestration/composer.py",
              "Factory/branch/story/duration.py":"Story/Pipeline_Orchestration/duration.py",
              "Factory/branch/story/render_main.py":"Story/Final_Render/render_video.py",
              "Factory/branch/story/ffmpeg_render.py":"Story/Final_Render/ffmpeg_render.py",
              "Factory/branch/story/ass_builder.py":"Story/Subtitles_Text/ass_builder.py",
              "Factory/branch/story/colors.py":"Config/App_Configs/palette.py",
              "Factory/branch/story/cta_maker.py":"Story/Thumbnails/cta_maker.py",
